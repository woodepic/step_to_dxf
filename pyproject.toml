[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plynest"
version = "0.1.0"
description = "Nest a STEP plywood assembly onto 4x8 sheets and export CNC-ready DXF"
requires-python = ">=3.10"
dependencies = [
    "cadquery-ocp>=7.7",
    "ezdxf>=1.3",
    "shapely>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
plynest = "plynest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plynest = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
